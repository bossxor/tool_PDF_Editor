<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C97FF"/>
      <stop offset="1" stop-color="#4A5FD9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEFF5"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1a2454" flood-opacity="0.35"/>
    </filter>
    <filter id="paperShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1a2454" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="512" rx="228" fill="#ffffff" opacity="0.06"/>

  <!-- document with folded corner -->
  <g filter="url(#paperShadow)">
    <path d="M 336 216
             L 590 216
             L 688 314
             L 688 792
             a 36 36 0 0 1 -36 36
             L 336 828
             a 36 36 0 0 1 -36 -36
             L 300 252
             a 36 36 0 0 1 36 -36 Z"
          fill="url(#paper)"/>
    <path d="M 590 216 L 590 278 a 36 36 0 0 0 36 36 L 688 314 Z" fill="#D7DCEA"/>
  </g>

  <!-- text lines -->
  <rect x="366" y="400" width="262" height="26" rx="13" fill="#B9C0D6"/>
  <rect x="366" y="456" width="262" height="26" rx="13" fill="#B9C0D6"/>
  <rect x="366" y="512" width="170" height="26" rx="13" fill="#B9C0D6"/>

  <!-- highlighter stroke accent -->
  <g filter="url(#soft)">
    <rect x="330" y="586" width="330" height="70" rx="18" transform="rotate(-6 330 586)" fill="url(#marker)"/>
  </g>
  <rect x="330" y="586" width="330" height="70" rx="18" transform="rotate(-6 330 586)" fill="url(#marker)"/>

  <!-- pen tip -->
  <g transform="translate(654 566) rotate(39)">
    <path d="M0 0 L 46 0 L 60 44 L 23 70 L -14 44 Z" fill="#3A3F55"/>
    <path d="M0 0 L46 0 L 40 20 L 6 20 Z" fill="#565C78"/>
  </g>
</svg>
